# Kiểm tra mỗi Pull Request: typecheck, lint, test, E2E. deploy.yml gọi lại workflow này
# (workflow_call) nên code lên production cũng phải qua đủ các bước trên.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Chỉ hủy lượt cũ của PR; lượt được deploy.yml gọi thì để chạy hết.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lấy phiên bản pnpm từ "packageManager" trong package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright.config.ts dùng channel "chrome" (Chrome bản ổn định). Runner có sẵn Chrome nên
      # cần --force để cài đè bản Playwright hỗ trợ.
      - run: pnpm exec playwright install --with-deps --force chrome
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
