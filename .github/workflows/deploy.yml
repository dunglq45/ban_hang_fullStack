# Deploy production khi có commit vào main (merge PR); chạy tay (Actions → Deploy → Run workflow)
# để deploy môi trường preview. Thứ tự: CI (typecheck, lint, test, E2E) → build → migration D1
# remote → wrangler deploy. Migration chạy trước khi code mới lên nên phải tương thích với code
# đang chạy (xem docs/VAN-HANH.md mục 4).
#
# Cấu hình một lần (docs/VAN-HANH.md mục 1.5):
# - Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# - Variable DEPLOY_ENABLED = true (Settings → Secrets and variables → Actions → Variables) sau khi đã
#   điền database_id thật vào wrangler.jsonc. Chưa đặt thì workflow bỏ qua, không deploy.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Môi trường
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

# Không chạy hai lần deploy cùng môi trường song song (migration chồng nhau). backup.yml dùng chung
# nhóm deploy-production để không export giữa lúc migration.
concurrency:
  group: deploy-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  ci:
    # Production chỉ deploy từ main (chạy tay chọn production ở nhánh khác sẽ bị bỏ qua).
    if: vars.DEPLOY_ENABLED == 'true' && (inputs.target == 'preview' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target || 'production' }}
    env:
      TARGET: ${{ inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build trước: build hỏng thì dừng khi schema chưa đổi.
      - name: Build
        run: |
          if [ "$TARGET" = "preview" ]; then pnpm build:preview; else pnpm build; fi

      # Token Cloudflare chỉ đưa vào các bước cần, không lộ cho install/build (code bên thứ ba).
      # Script migrate dùng `-c wrangler.jsonc` nên không bị config Vite vừa sinh ra chi phối.
      - name: Áp dụng migration D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$TARGET" = "preview" ]; then pnpm db:migrate:preview; else pnpm db:migrate:remote; fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
