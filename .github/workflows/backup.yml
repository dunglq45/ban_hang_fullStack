# Sao lưu D1 production mỗi ngày: export ra file SQL rồi cất vào bucket R2 riêng "store-app-backups"
# (tạo một lần, đặt lifecycle xóa file sau 90 ngày — xem docs/VAN-HANH.md mục 2). Chạy tay được.
# File backup chứa dữ liệu khách hàng: KHÔNG đưa lên artifact của GitHub.
# Thất bại thì GitHub gửi email cho người bật workflow (Settings → Notifications → Actions).
name: Backup D1

on:
  schedule:
    - cron: "0 21 * * *" # 04:00 giờ Việt Nam, lúc cửa hàng vắng (export làm D1 chậm trong lúc chạy)
  workflow_dispatch:

permissions:
  contents: read

# Chung nhóm với deploy production: không export giữa lúc đang chạy migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backup:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export D1 và tải lên R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          name="store-app-db-$(date -u +%Y%m%d-%H%M).sql"
          pnpm exec wrangler d1 export store-app-db --remote -c wrangler.jsonc --output="$name"
          gzip "$name"
          pnpm exec wrangler r2 object put "store-app-backups/d1/$name.gz" --file="$name.gz" --remote -c wrangler.jsonc
          ls -lh "$name.gz"
