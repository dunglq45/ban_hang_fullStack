<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thanh toán trên điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1849A9}a:hover{color:#123A87}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #101828; background: #FFFFFF; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums">
  <div style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 4px; border-bottom: 1px solid #E4E7EC; flex-shrink: 0">
    <a href="BanHangMobile.dc.html" aria-label="Quay lại chọn hàng" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #344054"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1 1 auto; font-size: 17px; font-weight: 600">Hóa đơn 1</div>
    <button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #B42318; font-size: 14px; font-weight: 600; font-family: inherit">Xóa đơn</button>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 4px 4px 12px; border: 1px solid #D0D5DD; border-radius: 8px; box-sizing: border-box">
      <div style="flex: 1 1 auto; min-width: 0; line-height: 1.35">
        <div style="font-size: 14px; font-weight: 600">Chị Lan · 0912 345 678</div>
        <div style="font-size: 12px; color: #B54708">Nợ cũ 350.000</div>
      </div>
      <button aria-label="Đổi khách" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5B6474; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
    </div>

    <div>
      <sc-for list="{{cart}}" as="i" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #F2F4F7">
          <div style="flex: 1 1 auto; min-width: 0; line-height: 1.35">
            <div style="font-size: 14px; font-weight: 500">{{i.name}}</div>
            <div style="font-size: 12px; color: #5B6474">{{i.price}} · <span style="color: #101828; font-weight: 600">{{i.total}}</span></div>
          </div>
          <div style="display: flex; align-items: center; border: 1px solid #D0D5DD; border-radius: 6px; height: 40px; box-sizing: border-box">
            <button aria-label="Bớt 1" style="width: 40px; height: 38px; border: 0; background: transparent; font-size: 18px; color: #344054; font-family: inherit">−</button>
            <span style="min-width: 32px; text-align: center; font-size: 14px; font-weight: 600; border-left: 1px solid #E4E7EC; border-right: 1px solid #E4E7EC; line-height: 38px">{{i.qty}}</span>
            <button aria-label="Thêm 1" style="width: 40px; height: 38px; border: 0; background: transparent; font-size: 18px; color: #344054; font-family: inherit">+</button>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
      <div style="display: flex; justify-content: space-between"><span style="color: #475467">Tổng tiền hàng</span><span>113.000</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #475467">Giảm giá</span><span>0</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px; border-top: 1px solid #E4E7EC"><span style="font-weight: 600">Khách cần trả</span><span style="font-size: 20px; font-weight: 700">113.000</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="m-khach-dua" style="font-size: 13px; font-weight: 500; color: #344054">Khách thanh toán</label>
      <input id="m-khach-dua" type="text" inputmode="numeric" value="100.000" style="height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font-size: 15px; font-family: inherit; color: #101828; background: #FFFFFF; box-sizing: border-box; width: 100%; height: 48px; font-size: 18px; font-weight: 700; text-align: right">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <button style="height: 40px; border: 1px solid #D0D5DD; border-radius: 6px; background: #FFFFFF; font-size: 13px; font-weight: 500; font-family: inherit; color: #344054">Vừa đủ</button>
        <button aria-pressed="true" style="height: 40px; border: 1px solid #D0D5DD; border-radius: 6px; background: #FFFFFF; font-size: 13px; font-weight: 500; font-family: inherit; color: #344054; border-color: {{accent}}; background: {{accentTint}}; color: {{accent}}; font-weight: 600">100k</button>
        <button style="height: 40px; border: 1px solid #D0D5DD; border-radius: 6px; background: #FFFFFF; font-size: 13px; font-weight: 500; font-family: inherit; color: #344054">200k</button>
        <button style="height: 40px; border: 1px solid #D0D5DD; border-radius: 6px; background: #FFFFFF; font-size: 13px; font-weight: 500; font-family: inherit; color: #344054">500k</button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600; color: #B54708">Còn thiếu · ghi nợ</span><span style="font-weight: 700; color: #B54708">13.000</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #5B6474">Dư nợ của khách sau đơn này</span><span style="color: #344054">363.000</span></div>
  </div>

  <div style="padding: 10px 12px 14px; border-top: 1px solid #E4E7EC; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <input id="m-in" type="checkbox" checked style="width: 18px; height: 18px; accent-color: {{accent}}">
      <label for="m-in" style="font-size: 14px; color: #344054">In hóa đơn qua máy in Bluetooth</label>
    </div>
    <a href="HoaDon.dc.html" style="height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; height: 52px; width: 100%; font-size: 16px; text-decoration: none">Hoàn tất bán hàng</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1849A9","options":["#1849A9","#0E7C66","#344054","#B93815"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1849A9';
    return { accent, accentTint: accent + '14',
      cart: [
        { name: 'Mì gói tôm chua cay', price: '4.500', qty: 10, total: '45.000' },
        { name: 'Sữa tươi hộp 180ml', price: '8.000', qty: 2, total: '16.000' },
        { name: 'Dầu ăn 1 lít', price: '52.000', qty: 1, total: '52.000' }
      ] };
  }
}
</script>
</body>
</html>
