<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bán hàng trên điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1849A9}a:hover{color:#123A87}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #101828; background: #FFFFFF; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums">
  <div style="padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E4E7EC; flex-shrink: 0">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="line-height: 1.3"><div style="font-size: 17px; font-weight: 600">Bán hàng</div><div style="font-size: 12px; color: #5B6474">Tạp hóa Minh Anh · Ca sáng</div></div>
      <button style="height: 40px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; font-size: 13px; font-weight: 600; font-family: inherit; color: #344054; display: inline-flex; align-items: center; gap: 4px">Hóa đơn 1<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6474" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <label for="m-tim" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm hàng</label>
        <input id="m-tim" type="search" placeholder="Tìm tên hoặc mã hàng" style="flex: 1 1 auto; min-width: 0; border: 0; outline: none; font-size: 15px; font-family: inherit; background: transparent">
      </div>
      <button aria-label="Quét mã vạch" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: #101828; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6v12"></path><path d="M8 6v12"></path><path d="M11 6v12"></path><path d="M15 6v12"></path><path d="M18 6v12"></path><path d="M20.5 6v12"></path></svg></button>
    </div>
    <div style="display: flex; gap: 18px; overflow-x: auto; margin-bottom: -11px">
      <button aria-pressed="true" style="height: 48px; padding: 0 2px; border: 0; border-bottom: 2px solid {{accent}}; background: transparent; color: #101828; font-size: 14px; font-weight: 600; font-family: inherit; white-space: nowrap; display: flex; align-items: center; gap: 8px; height: 40px">Tất cả</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #5B6474; font-size: 14px; font-weight: 500; font-family: inherit; white-space: nowrap; display: flex; align-items: center; gap: 8px; height: 40px">Đồ uống</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #5B6474; font-size: 14px; font-weight: 500; font-family: inherit; white-space: nowrap; display: flex; align-items: center; gap: 8px; height: 40px">Mì, gạo</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #5B6474; font-size: 14px; font-weight: 500; font-family: inherit; white-space: nowrap; display: flex; align-items: center; gap: 8px; height: 40px">Gia vị</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #5B6474; font-size: 14px; font-weight: 500; font-family: inherit; white-space: nowrap; display: flex; align-items: center; gap: 8px; height: 40px">Bánh kẹo</button>
    </div>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden">
    <sc-for list="{{products}}" as="p" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 64px; border-bottom: 1px solid #F2F4F7; box-sizing: border-box">
        <div style="flex: 1 1 auto; min-width: 0; line-height: 1.35">
          <div style="font-size: 15px; font-weight: 500">{{p.name}}</div>
          <sc-if value="{{p.low}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; font-weight: 600; color: #B54708">{{p.code}} · Tồn {{p.stock}}</div></sc-if>
          <sc-if value="{{p.ok}}" hint-placeholder-val="{{true}}"><div style="font-size: 12px; color: #5B6474">{{p.code}} · Tồn {{p.stock}}</div></sc-if>
        </div>
        <div style="font-size: 15px; font-weight: 600">{{p.price}}</div>
        <sc-if value="{{p.inCart}}" hint-placeholder-val="{{false}}">
          <span style="min-width: 44px; height: 44px; padding: 0 8px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-sizing: border-box" aria-label="Đã chọn {{p.qty}}">{{p.qty}}</span>
        </sc-if>
        <sc-if value="{{p.notInCart}}" hint-placeholder-val="{{true}}">
          <button aria-label="Thêm {{p.name}}" style="width: 44px; height: 44px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: {{accent}}; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 10px 12px; border-top: 1px solid #E4E7EC; background: #FFFFFF; flex-shrink: 0">
    <a href="ThanhToanMobile.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 16px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; text-decoration: none">
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 12px; opacity: 0.85">3 món · Chị Lan</span><span style="font-size: 17px; font-weight: 700">113.000</span></span>
      <span style="font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px">Thanh toán<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
    </a>
  </div>
  <nav aria-label="Điều hướng" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #E4E7EC; background: #FFFFFF; padding: 6px 4px 10px; flex-shrink: 0"><a href="#Bán hàng" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; color: {{accent}}; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1.5"></circle><circle cx="17" cy="20" r="1.5"></circle></svg>Bán hàng</a><a href="#Hàng hóa" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; color: #5B6474; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>Hàng hóa</a><a href="#Sổ nợ" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; color: #5B6474; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4z"></path><path d="M9 9h6"></path><path d="M9 13h4"></path></svg>Sổ nợ</a><a href="#Báo cáo" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; color: #5B6474; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11"></path><path d="M10 20V5"></path><path d="M16 20v-6"></path><path d="M2 20h20"></path></svg>Báo cáo</a><a href="#Thêm" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; color: #5B6474; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>Thêm</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1849A9","options":["#1849A9","#0E7C66","#344054","#B93815"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1849A9';
    return { accent, accentTint: accent + '14',
      products: [
        { code: 'SP0012', name: 'Mì gói tôm chua cay', price: '4.500', stock: '120', low: false, qty: 10 },
        { code: 'SP0003', name: 'Nước suối 500ml', price: '5.000', stock: '48', low: false, qty: 0 },
        { code: 'SP0005', name: 'Nước ngọt lon', price: '10.000', stock: '36', low: false, qty: 0 },
        { code: 'SP0031', name: 'Sữa tươi hộp 180ml', price: '8.000', stock: '4', low: true, qty: 2 },
        { code: 'SP0047', name: 'Dầu ăn 1 lít', price: '52.000', stock: '12', low: false, qty: 1 },
        { code: 'SP0060', name: 'Gạo ST25 (kg)', price: '32.000', stock: '85', low: false, qty: 0 },
        { code: 'SP0052', name: 'Nước mắm 500ml', price: '38.000', stock: '2', low: true, qty: 0 }
      ].map((p) => ({ ...p, ok: !p.low, inCart: p.qty > 0, notInCart: p.qty === 0 })) };
  }
}
</script>
</body>
</html>
